services:
  qdrant:
    image: qdrant/qdrant:v1.20.0

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    # The key is read at container start, never copied into the image (.env is dockerignored).
    # Without it, saved queries still work and new queries fall back to BM25 only.
    env_file:
      - path: services/api/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [qdrant]

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
